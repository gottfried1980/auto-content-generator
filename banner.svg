<svg xmlns="http://w3.org" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="aiPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bc47ff" />
      <stop offset="100%" stop-color="#8626ff" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bc47ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#21759b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mediaLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="50%" stop-color="#bc47ff" />
      <stop offset="100%" stop-color="#58a6ff" />
    </linearGradient>
    
    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Ambient Glow -->
  <circle cx="950" cy="200" r="280" fill="url(#glowGrad)" filter="url(#glow)" opacity="0.35" />
  <circle cx="200" cy="300" r="150" fill="url(#glowGrad)" filter="url(#glow)" opacity="0.1" />

  <!-- Visual Workflow Diagram (Right Aligned) -->
  <g transform="translate(750, 60)" opacity="0.9">
    <!-- Flow connection pipes -->
    <path d="M 60 70 L 150 140" stroke="#30363d" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M 60 210 L 150 140" stroke="#30363d" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M 150 140 L 300 140" stroke="url(#mediaLine)" stroke-width="2.5"/>
    <path d="M 300 140 L 370 70" stroke="#58a6ff" stroke-width="2"/>
    <path d="M 300 140 L 370 210" stroke="#ff7b72" stroke-width="2"/>

    <!-- Left Input Node 1: WordPress Tags -->
    <g transform="translate(0, 40)">
      <rect width="120" height="50" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
      <text x="60" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e" font-weight="bold" text-anchor="middle">WP Tags</text>
      <circle cx="120" cy="25" r="4" fill="#39d353" />
    </g>

    <!-- Left Input Node 2: Scheduler / Cron (With Native Clock Icon) -->
    <g transform="translate(0, 180)">
      <rect width="120" height="50" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
      <!-- Native Vector Clock Icon -->
      <g transform="translate(12, 18)" stroke="#8b949e" stroke-width="1.5" fill="none">
        <circle cx="7" cy="7" r="6"/>
        <polyline points="7,3 7,7 10,7"/>
      </g>
      <text x="70" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e" font-weight="bold" text-anchor="middle">Daily Cron</text>
      <circle cx="120" cy="25" r="4" fill="#39d353" />
    </g>

    <!-- Center AI Engine Processor -->
    <g transform="translate(150, 105)">
      <rect width="150" height="70" rx="10" fill="url(#aiPurple)" stroke="#bc47ff" stroke-width="2" filter="url(#glow)"/>
      <rect width="150" height="70" rx="10" fill="#161b22" stroke="#bc47ff" stroke-width="1.5"/>
      <text x="75" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#ffffff" font-weight="800" text-anchor="middle" letter-spacing="0.5">OPENAI CORE</text>
      <text x="75" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#bc47ff" font-weight="bold" text-anchor="middle">GENERATOR</text>
      <circle cx="0" cy="35" r="5" fill="#bc47ff" />
      <circle cx="150" cy="35" r="5" fill="#58a6ff" />
    </g>

    <!-- Output 1: DALL-E 3 Image (With Native Image Icon) -->
    <g transform="translate(370, 40)">
      <rect width="140" height="50" rx="6" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
      <!-- Native Vector Image Icon -->
      <g transform="translate(12, 18)" stroke="#58a6ff" stroke-width="1.5" fill="none">
        <rect x="1" y="1" width="13" height="11" rx="1"/>
        <circle cx="5" cy="5" r="1.5"/>
        <polyline points="2,11 6,7 10,11"/>
      </g>
      <text x="82" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#c9d1d9" font-weight="600" text-anchor="middle">DALL-E 3 Image</text>
    </g>

    <!-- Output 2: YouTube Video (With Native Video Icon) -->
    <g transform="translate(370, 180)">
      <rect width="140" height="50" rx="6" fill="#21262d" stroke="#ff7b72" stroke-width="1.5"/>
      <!-- Native Vector Play Icon -->
      <g transform="translate(14, 18)" stroke="#ff7b72" stroke-width="1.5" fill="none">
        <rect x="1" y="1" width="13" height="11" rx="1"/>
        <polygon points="6,4 10,6.5 6,9" fill="#ff7b72"/>
      </g>
      <text x="82" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#c9d1d9" font-weight="600" text-anchor="middle">YouTube Embed</text>
    </g>
  </g>

  <!-- Title & Typography (Left Aligned) -->
  <g transform="translate(80, 0)">
    <!-- Tech Label -->
    <text x="0" y="140" font-family="Courier, monospace" font-size="14" fill="#bc47ff" font-weight="bold" letter-spacing="2">AUTOMATED CONTENT ENGINE</text>
    
    <!-- Main Title -->
    <text x="0" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-1">
      High Precision
    </text>
    <text x="0" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="url(#aiPurple)" letter-spacing="-1">
      Content Generator
    </text>

    <!-- Subtitle -->
    <text x="0" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#8b949e" font-weight="400">
      AI-driven automated post creation with DALL-E 3 &amp; YouTube integration.
    </text>

    <!-- Specs Badges inside SVG -->
    <g transform="translate(0, 335)">
      <rect x="0" y="0" width="75" height="24" rx="4" fill="#21262d" stroke="#30363d" />
      <text x="37.5" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e" font-weight="600" text-anchor="middle">v15.1</text>

      <rect x="85" y="0" width="130" height="24" rx="4" fill="#1f6feb" fill-opacity="0.1" stroke="#bc47ff" stroke-opacity="0.4" />
      <text x="150" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#bc47ff" font-weight="700" text-anchor="middle">OpenAI &amp; DALL-E 3</text>
      
      <rect x="225" y="0" width="65" height="24" rx="4" fill="#21262d" stroke="#30363d" />
      <text x="257.5" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#ff7b72" font-weight="600" text-anchor="middle">YouTube</text>
    </g>
  </g>
</svg>
