<svg xmlns="http://w3.org" viewBox="0 0 1200 400" width="100%" height="100%">
  <!-- Background Layer -->
  <rect width="1200" height="400" fill="#0d1117" />
  
  <!-- Geometric Grid (Pure Paths) -->
  <g stroke="#30363d" stroke-width="1" opacity="0.3">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="40" y1="0" x2="40" y2="400" />
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="120" y1="0" x2="120" y2="400" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="280" y1="0" x2="280" y2="400" />
    <line x1="720" y1="0" x2="720" y2="400" />
    <line x1="760" y1="0" x2="760" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="840" y1="0" x2="840" y2="400" />
    <line x1="880" y1="0" x2="880" y2="400" />
    <line x1="920" y1="0" x2="920" y2="400" />
    <line x1="960" y1="0" x2="960" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
    <line x1="1040" y1="0" x2="1040" y2="400" />
    <line x1="1080" y1="0" x2="1080" y2="400" />
    <line x1="1120" y1="0" x2="1120" y2="400" />
    <line x1="1160" y1="0" x2="1160" y2="400" />
  </g>

  <!-- Visual Workflow Diagram (Right Aligned) -->
  <g transform="translate(750, 60)" opacity="0.9">
    <!-- Connection lines -->
    <path d="M 60 70 L 150 140" stroke="#30363d" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M 60 210 L 150 140" stroke="#30363d" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M 150 140 L 300 140" stroke="#bc47ff" stroke-width="2.5"/>
    <path d="M 300 140 L 370 70" stroke="#58a6ff" stroke-width="2"/>
    <path d="M 300 140 L 370 210" stroke="#ff7b72" stroke-width="2"/>

    <!-- Left Input Node 1: WordPress Tags -->
    <g transform="translate(0, 40)">
      <rect width="120" height="50" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
      <text x="60" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e" font-weight="bold" text-anchor="middle">WP Tags</text>
      <circle cx="120" cy="25" r="4" fill="#39d353" />
    </g>

    <!-- Left Input Node 2: Scheduler / Cron (With Native Clock Icon) -->
    <g transform="translate(0, 180)">
      <rect width="120" height="50" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
      <g transform="translate(15, 18)" stroke="#8b949e" stroke-width="1.5" fill="none">
        <circle cx="7" cy="7" r="6"/>
        <polyline points="7,3 7,7 10,7"/>
      </g>
      <text x="75" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e" font-weight="bold" text-anchor="middle">Daily Cron</text>
      <circle cx="120" cy="25" r="4" fill="#39d353" />
    </g>

    <!-- Center AI Engine Processor -->
    <g transform="translate(140, 105)">
      <rect width="160" height="70" rx="10" fill="#161b22" stroke="#bc47ff" stroke-width="2"/>
      <text x="80" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#ffffff" font-weight="800" text-anchor="middle" letter-spacing="0.5">OPENAI CORE</text>
      <text x="80" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#bc47ff" font-weight="bold" text-anchor="middle">GENERATOR</text>
    </g>

    <!-- Output 1: DALL-E 3 Image (With Native Image Icon) -->
    <g transform="translate(370, 40)">
      <rect width="140" height="50" rx="6" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
      <g transform="translate(15, 18)" stroke="#58a6ff" stroke-width="1.5" fill="none">
        <rect x="1" y="1" width="13" height="11" rx="1"/>
        <circle cx="5" cy="5" r="1.5"/>
        <polyline points="2,11 6,7 10,11"/>
      </g>
      <text x="85" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#c9d1d9" font-weight="600" text-anchor="middle">DALL-E 3 Image</text>
    </g>

    <!-- Output 2: YouTube Video -->
    <g transform="translate(370, 180)">
      <rect width="140" height="50" rx="6" fill="#21262d" stroke="#ff7b72" stroke-width="1.5"/>
      <g transform="translate(15, 18)" stroke="#ff7b72" stroke-width="1.5" fill="none">
        <rect x="1" y="1" width="13" height="11" rx="1"/>
        <polygon points="6,4 10,6.5 6,9" fill="#ff7b72"/>
      </g>
      <text x="85" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#c9d1d9" font-weight="600" text-anchor="middle">YouTube Embed</text>
    </g>
  </g>

  <!-- Title & Typography (Left Aligned) -->
  <g transform="translate(80, 0)">
    <!-- Tech Label -->
    <text x="0" y="140" font-family="Courier, monospace" font-size="14" fill="#bc47ff" font-weight="bold" letter-spacing="2">AUTOMATED CONTENT ENGINE</text>
    
    <!-- Main Title -->
    <text x="0" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-1">
      High Precision
    </text>
    <text x="0" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="#bc47ff" letter-spacing="-1">
      Content Generator
    </text>

    <!-- Subtitle -->
    <text x="0" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#8b949e" font-weight="400">
      AI-driven automated post creation with DALL-E 3 and YouTube integration.
    </text>

    <!-- Specs Badges inside SVG -->
    <g transform="translate(0, 335)">
      <rect x="0" y="0" width="75" height="24" rx="4" fill="#21262d" stroke="#30363d" />
      <text x="37.5" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e" font-weight="600" text-anchor="middle">v15.1</text>

      <rect x="85" y="0" width="130" height="24" rx="4" fill="#161b22" stroke="#bc47ff" />
      <text x="150" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#bc47ff" font-weight="700" text-anchor="middle">OpenAI &amp; DALL-E 3</text>
      
      <rect x="225" y="0" width="65" height="24" rx="4" fill="#21262d" stroke="#30363d" />
      <text x="257.5" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#ff7b72" font-weight="600" text-anchor="middle">YouTube</text>
    </g>
  </g>
</svg>
