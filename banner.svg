<svg xmlns="http://w3.org" viewBox="0 0 1200 400" width="100%" height="100%">
  <!-- Background Layer (Identisch mit Banner 1) -->
  <rect width="1200" height="400" fill="#0d1117" />

  <!-- Abstract Tech Graphic: Connected Tags (Identisch mit der funktionierenden Logik aus Banner 1) -->
  <g transform="translate(800, 80)" opacity="0.85">
    <!-- Connection Lines -->
    <line x1="120" y1="60" x2="240" y2="100" stroke="#30363d" stroke-width="2" stroke-dasharray="4 4" />
    <line x1="120" y1="60" x2="60" y2="160" stroke="#bc47ff" stroke-width="2" />
    <line x1="60" y1="160" x2="160" y2="240" stroke="#30363d" stroke-width="2" />
    <line x1="240" y1="100" x2="160" y2="240" stroke="#bc47ff" stroke-width="1.5" />
    <line x1="240" y1="100" x2="280" y2="220" stroke="#30363d" stroke-width="2" />
    <line x1="160" y1="240" x2="40" y2="280" stroke="#30363d" stroke-width="2" stroke-dasharray="2 2" />

    <!-- Tag Node 1 -->
    <g transform="translate(120, 60)">
      <rect x="-60" y="-20" width="120" height="40" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
      <circle cx="-40" cy="0" r="4" fill="#00a0d2" />
      <text x="-25" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8b949e" font-weight="600">OpenAI</text>
    </g>

    <!-- Tag Node 2 (Active Core) -->
    <g transform="translate(60, 160)">
      <rect x="-55" y="-20" width="110" height="40" rx="8" fill="#8626ff" stroke="#bc47ff" stroke-width="1.5"/>
      <circle cx="-35" cy="0" r="4" fill="#ffffff" />
      <text x="-20" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#ffffff" font-weight="bold">DALL-E 3</text>
    </g>

    <!-- Tag Node 3 -->
    <g transform="translate(240, 100)">
      <rect x="-45" y="-20" width="90" height="40" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
      <circle cx="-25" cy="0" r="4" fill="#ff7b72" />
      <text x="-12" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8b949e" font-weight="600">YouTube</text>
    </g>

    <!-- Tag Node 4 -->
    <g transform="translate(160, 240)">
      <rect x="-40" y="-20" width="80" height="40" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
      <circle cx="-22" cy="0" r="4" fill="#79c0ff" />
      <text x="-10" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8b949e" font-weight="600">Posts</text>
    </g>

    <!-- Tag Node 5 -->
    <g transform="translate(280, 220)">
      <rect x="-50" y="-20" width="100" height="40" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
      <circle cx="-30" cy="0" r="4" fill="#39d353" />
      <text x="-15" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8b949e" font-weight="600">Scheduler</text>
    </g>
  </g>

  <!-- Typography / Brand Elements (Left Aligned) -->
  <g transform="translate(80, 0)">
    <!-- Code Bracket Icon Decor -->
    <text x="0" y="150" font-family="Courier, monospace" font-size="28" fill="#bc47ff" font-weight="bold" opacity="0.4">&lt;/&gt;</text>
    
    <!-- Main Title -->
    <text x="0" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-1">
      High Precision
    </text>
    <text x="0" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="800" fill="#bc47ff" letter-spacing="-1">
      Content Generator
    </text>

    <!-- Subtitle / Description -->
    <text x="0" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#8b949e" font-weight="400">
      AI-driven automated post creation with DALL-E 3 and YouTube integration.
    </text>

    <!-- Decorative Badges inside SVG -->
    <g transform="translate(0, 340)">
      <rect x="0" y="0" width="75" height="24" rx="4" fill="#21262d" stroke="#30363d" />
      <text x="37.5" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e" font-weight="600" text-anchor="middle">v15.1</text>

      <rect x="85" y="0" width="65" height="24" rx="4" fill="#21262d" stroke="#30363d" />
      <text x="117.5" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e" font-weight="600" text-anchor="middle">GPL-2.0</text>
      
      <rect x="160" y="0" width="110" height="24" rx="4" fill="#161b22" stroke="#bc47ff" stroke-opacity="0.4" />
      <text x="215" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#bc47ff" font-weight="600" text-anchor="middle">Multi-Language</text>
    </g>
  </g>
</svg>
